; ================================================================
; llama.cpp server preset — Qwen3.6-35B-A3B (MoE, 12GB VRAM)
; ================================================================
; GLOBAL defaults applied to all presets below.
; Model-specific sections override these where needed.
; ================================================================

[*]
; ── Hardware / Performance ──────────────────────────────────────
n-gpu-layers = 999
threads = 8
threads-batch = 16
batch-size = 4096
ubatch-size = 4096

; ── Context / KV Cache ──────────────────────────────────────────
ctx-size = 131072
cache-ram = 8192
kv-unified = true
flash-attn = on
swa-full = true
cache-type-k = q8_0
cache-type-v = q8_0
no-mmap = true

; ── Sampling Defaults ───────────────────────────────────────────
temp = 0.6
top-k = 20
top-p = 0.95
min-p = 0.00
typical-p = 0.5
repeat-penalty = 1.00
repeat-last-n = -1
presence-penalty = 0.0

; ── DRY (Don't Repeat Yourself) Sampling ────────────────────────
dry-multiplier = 1.5
dry-base = 1.75
dry-allowed-length = 2
dry-penalty-last-n = -1

; ── Server ──────────────────────────────────────────────────────
parallel = 1
cache-reuse = 512
seed = -1

; ================================================================
; Qwen3.6-35B-A3B-Q6_K_XL — Unsloth (MoE, text-only)
; ================================================================
[Qwen3.6-35B-A3B-Q6_K_XL-Unsloth]

; Model reference — use repo path so HF auto-downloads work on refresh
model = unsloth/Qwen3.6-35B-A3B-GGUF:Q6_K_XL

; MoE expert weights stay on CPU for VRAM management
cpu-moe = true

; Chat template / reasoning settings
reasoning = on
jinja = true
chat-template-kwargs = {"preserve_thinking": true}
reasoning-budget = 8096
reasoning-budget-message = Okay, enough thinking no more waiting. Let's just jump to it.

; Context (already set globally, but explicit here for clarity)
ctx-size = 131072

; KV cache quantization (saves ~50% VRAM vs F16)
cache-type-k = q8_0
cache-type-v = q8_0

; Disable mmap and multimodal projector
no-mmap = true
no-mmproj = true

; Sliding window attention for long contexts
swa-full = true

; KV cache reuse
cache-reuse = 512
